name: Update and Publish CIA with QR Code + other assets

on:
  push:
    paths:
      - 'source/**'
      - 'banner/**'
      - 'icon.png'
      - 'config.rsf'
      - 'Makefile'
      - '.github/workflows/pages.yml'
      # Add any other folders or files used in your program such as assets/**
    branches:
      - master

env:
  REPO_NAME: ${{ github.event.repository.name }}
  APP_NAME: ${{ github.event.repository.name }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      banner: ${{ steps.filter.outputs.banner }}
      icon: ${{ steps.filter.outputs.icon }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          src:
            - 'source/**'
            - 'Makefile'
            # ...
          banner:
            - 'banner/**'
          icon:
            - 'icon.png'
          workflow:
            - '.github/workflows/pages.yml'

  build-program:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm

    steps:
    - name: Checkout this repo
      uses: actions/checkout@v7
      with:
        path: ${{ env.REPO_NAME }}
        sparse-checkout: |
          source
          # ...

    - name: Compile 3DSX and ELF
      run: |
        cd ${{ env.REPO_NAME }}
        make
      
    - name: Upload 3DSX
      uses: actions/upload-artifact@v7
      with:
        name: 3dsx
        path: ${{ env.REPO_NAME }}/${{ env.REPO_NAME }}.3dsx

    - name: Upload ELF
      uses: actions/upload-artifact@v7
      with:
        path: ${{ env.REPO_NAME }}/${{ env.REPO_NAME }}.elf
        archive: 'false'

  build-banner:
    needs: changes
    if: ${{ needs.changes.outputs.banner == 'true' || needs.changes.outputs.icon == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest

    env:
      SHORT_TITLE: Hello World
      LONG_TITLE: 3DS Workflow Example
      PUBLISHER: The 3DS Homebrew Community
    
    steps:
    - name: Download Bannertool
      run: wget https://github.com/carstene1ns/3ds-bannertool/archive/refs/heads/main.zip -O bannertool.zip

    - name: Compile Bannertool
      run: |
        unzip bannertool.zip
        cd 3ds-bannertool-main
        cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build
    
    - name: Checkout this repo
      uses: actions/checkout@v7
      with:
        path: ${{ env.REPO_NAME }}
        sparse-checkout: |
          banner
          icon.png

    - name: Create Banner
      if: needs.changes.outputs.banner == 'true' || needs.changes.outputs.workflow == 'true'
      run: ./3ds-bannertool-main/build/bannertool makebanner -i ${{ env.REPO_NAME }}/banner/banner.png -a ${{ env.REPO_NAME }}/banner/banner.wav -o banner.bin

    - name: Upload Banner
      if: needs.changes.outputs.banner == 'true' || needs.changes.outputs.workflow == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: banner
        path: banner.bin
          
    - name: Create SMDH
      if: needs.changes.outputs.icon == 'true' || needs.changes.outputs.workflow == 'true'
      run: ./3ds-bannertool-main/build/bannertool makesmdh -s "${{ env.SHORT_TITLE }}" -l "${{ env.LONG_TITLE }}" -p "${{ env.PUBLISHER }}" -i ${{ env.REPO_NAME }}/icon.png -o icon.smdh

    - name: Upload SMDH
      if: needs.changes.outputs.icon == 'true' || needs.changes.outputs.workflow == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: icon
        path: icon.smdh

  build-cia:
    if: ${{ always() }}
    needs: [changes, build-program, build-banner]
    runs-on: ubuntu-latest

    steps:
      - name: Get Pages URL
        id: url
        uses: tuftsrt/get-pages-url@v1
        env:
          PAGES_BASE_URL: ${{ steps.url.outputs.url }}

      - name: Create Pages Artifact Folder
        run: mkdir pages

      - name: Download 3DSX From Artifact
        if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.workflow == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: 3dsx
          path: pages/${{ env.APP_NAME }}.3dsx

      - name: Download 3DSX From Pages
        if: ${{ needs.changes.outputs.src == 'false' && needs.changes.outputs.workflow == 'false' }}
        run: wget ${{ env.PAGES_BASE_URL }}/${{ env.REPO_NAME }}.3dsx pages/${{ env.APP_NAME }}.3dsx

      - name: Download ELF From Artifact
        if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.workflow == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.REPO_NAME }}.elf
          path: pages/${{ env.APP_NAME }}.elf

      - name: Download ELF From Pages
        if: ${{ needs.changes.outputs.src == 'false' && needs.changes.outputs.workflow == 'false' }}
        run: wget ${{ env.PAGES_BASE_URL }}/${{ env.REPO_NAME }}.elf pages/${{ env.APP_NAME }}.elf

      - name: Download Banner From Artifact
        if: ${{ needs.changes.outputs.banner == 'true' || needs.changes.outputs.workflow == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: banner
          path: pages/banner.bin

      - name: Download Banner From Pages
        if: ${{ needs.changes.outputs.banner == 'false' && needs.changes.outputs.workflow == 'false' }}
        run: wget ${{ env.PAGES_BASE_URL }}/banner.bin pages/banner.bin
    
      - name: Download SMDH From Artifact
        if: ${{ needs.changes.outputs.icon == 'true' || needs.changes.outputs.workflow == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: icon
          path: pages/icon.smdh

      - name: Download SMDH From Pages
        if: ${{ needs.changes.outputs.icon == 'false' && needs.changes.outputs.workflow == 'false' }}
        run: wget ${{ env.PAGES_BASE_URL }}/icon.smdh pages/icon.smdh

      - name: Download Makerom
        run: wget https://github.com/3DSGuy/Project_CTR/archive/refs/heads/master.zip -O makerom.zip

      - name: Compile Makerom
        run: |
          unzip makerom.zip
          cd Project_CTR-master/makerom
          make deps
          make

      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
          sparse-checkout: config.rsf

      - name: Convert ELF to CIA
        run: ./Project_CTR-master/makerom/bin/makerom -f cia -o pages/${{ env.APP_NAME }}.cia -target t -exefslogo -elf pages/${{ env.APP_NAME }}.elf -rsf ${{ env.REPO_NAME }}/config.rsf -icon pages/icon.smdh -banner pages/banner.bin

      - name: Generate QR Code for CIA URL
        uses: snow-actions/qrcode@v2.0.0
        with:
          text: ${{ env.PAGES_BASE_URL }}/${{ env.APP_NAME }}.cia
          path: pages/qrcode-cia.png

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    needs: build-cia
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages Artifact
        uses: actions/deploy-pages@v4
